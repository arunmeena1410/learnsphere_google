<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Learnsphere Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      background: #ffffff;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #111827;
    }

    .logo-box {
      width: 40px;
      height: 40px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .logout-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* ================= CONTAINER ================= */

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .page-title {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    /* ================= STATS ================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .stat-title {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    /* ================= USER MANAGEMENT ================= */

    .users-section {
      background: white;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
    }

    .section-header {
      padding: 22px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
    }

    /* ================= SEARCH BAR ================= */

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      width: 280px;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    .clear-search {
      border: 1px solid #d1d5db;
      background: white;
      padding: 10px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    .clear-search:hover {
      background: #f3f4f6;
    }

    /* ================= TABLE ================= */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 20px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      font-weight: bold;
      color: #374151;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* ================= PMP BADGES ================= */

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-yes {
      background: #dcfce7;
      color: #166534;
    }

    .badge-no {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-admin {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-user {
      background: #f3f4f6;
      color: #374151;
    }

    /* ================= ACTION BUTTONS ================= */

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
    }

    .grant-btn,
    .revoke-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .grant-btn {
      background: #16a34a;
      color: white;
    }

    .grant-btn:hover {
      background: #15803d;
    }

    .revoke-btn {
      background: #f59e0b;
      color: white;
    }

    .revoke-btn:hover {
      background: #d97706;
    }

    /*
      DELETE BUTTON

      Smaller than Grant/Revoke and separated clearly
      to reduce accidental clicks.
    */

    .delete-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 6px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      margin-left: 22px;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .delete-btn:disabled,
    .grant-btn:disabled,
    .revoke-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ================= MESSAGES ================= */

    .message {
      padding: 15px 20px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-message {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 800px) {

      .navbar {
        padding: 0 20px;
      }

      .container {
        margin-top: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .section-header {
        align-items: stretch;
      }

      .search-box {
        width: 100%;
      }

      .search-input {
        width: 100%;
      }

      .clear-search {
        white-space: nowrap;
      }

      th,
      td {
        padding: 12px 14px;
      }

      .action-buttons {
        gap: 8px;
      }

      .delete-btn {
        margin-left: 14px;
      }
    }

    @media (max-width: 500px) {

      .navbar {
        height: 62px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-box {
        width: 35px;
        height: 35px;
      }

      .page-title {
        font-size: 25px;
      }

      .section-header {
        padding: 16px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-input,
      .clear-search {
        width: 100%;
      }

      .action-buttons {
        align-items: flex-start;
      }

      .delete-btn {
        margin-left: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav class="navbar">

    <div class="logo">

      <div class="logo-box">
        LS
      </div>

      <span>
        Learnsphere Admin
      </span>

    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </nav>


  <!-- ================= MAIN ================= -->

  <main class="container">

    <h1 class="page-title">
      Admin Dashboard
    </h1>

    <p class="page-subtitle">
      Manage Learnsphere users and course access.
    </p>


    <!-- ================= STATS ================= -->

    <div class="stats">

      <div class="stat-card">

        <div class="stat-title">
          Total Users
        </div>

        <div
          class="stat-value"
          id="totalUsers"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          Without PMP Access
        </div>

        <div
          class="stat-value"
          id="withoutPmp"
        >
          0
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-title">
          With PMP Access
        </div>

        <div
          class="stat-value"
          id="withPmp"
        >
          0
        </div>

      </div>

    </div>


    <!-- ================= USER MANAGEMENT ================= -->

    <section class="users-section">

      <div class="section-header">

        <div class="section-title">
          User Management
        </div>


        <!-- SEARCH BAR -->

        <div class="search-box">

          <input
            type="text"
            id="userSearch"
            class="search-input"
            placeholder="Search user by email or mobile..."
            autocomplete="off"
          />

          <button
            type="button"
            class="clear-search"
            onclick="clearSearch()"
          >
            Clear
          </button>

        </div>

      </div>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- TABLE -->

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                User
              </th>

              <th>
                Role
              </th>

              <th>
                PMP Access
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody id="usersTableBody">

            <tr>

              <td
                colspan="4"
                class="empty-message"
              >
                Loading users...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /*
      ============================================================
      API URL
      ============================================================

      Local development:
      http://localhost:5000/api

      Production:
      same domain /api

      If frontend and backend are deployed separately,
      you can set:

      window.LEARNSPHERE_API_URL = "https://your-backend-domain/api";
    */

    const API_URL =
      window.LEARNSPHERE_API_URL ||
      (
        (window.location.hostname === "localhost" ||
         window.location.hostname === "127.0.0.1")
          ? "http://localhost:5000/api"
          : `${window.location.origin}/api`
      );


    let allUsers = [];


    /* ================= AUTH ================= */

    function getToken() {

      return localStorage.getItem(
        "learnsphereToken"
      );

    }


    function logout() {

      localStorage.removeItem(
        "learnsphereToken"
      );

      localStorage.removeItem(
        "learnsphereUser"
      );

      window.location.href =
        "index.html";

    }


    /* ================= MESSAGE ================= */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent =
        text;

      message.className =
        `message ${type}`;

      setTimeout(() => {

        message.className =
          "message";

        message.textContent =
          "";

      }, 4000);

    }


    /* ================= LOAD USERS ================= */

    async function loadUsers() {

      const token =
        getToken();


      if (!token) {

        window.location.href =
          "index.html";

        return;

      }


      try {

        const response =
          await fetch(
            `${API_URL}/admin/users`,
            {
              method: "GET",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Could not load users."
          );

        }


        allUsers =
          Array.isArray(data.users)
            ? data.users
            : [];


        updateStats(
          allUsers
        );

        renderUsers(
          allUsers
        );


      } catch (error) {

        console.error(
          "Load users error:",
          error
        );

        showMessage(
          error.message ||
          "Could not load users.",
          "error"
        );

      }

    }


    /* ================= STATS ================= */

    function updateStats(
      users
    ) {

      const total =
        users.length;


      const withPmp =
        users.filter(
          user =>
            user.courseAccess &&
            user.courseAccess.pmp === true
        ).length;


      const withoutPmp =
        total - withPmp;


      document.getElementById(
        "totalUsers"
      ).textContent =
        total;


      document.getElementById(
        "withPmp"
      ).textContent =
        withPmp;


      document.getElementById(
        "withoutPmp"
      ).textContent =
        withoutPmp;

    }


    /* ================= SEARCH ================= */

    function searchUsers() {

      const searchValue =
        document
          .getElementById(
            "userSearch"
          )
          .value
          .trim()
          .toLowerCase();


      if (!searchValue) {

        renderUsers(
          allUsers
        );

        return;

      }


      const filteredUsers =
        allUsers.filter(
          user => {

            const identifier =
              String(
                user.identifier || ""
              ).toLowerCase();


            const role =
              String(
                user.role || ""
              ).toLowerCase();


            return (
              identifier.includes(
                searchValue
              ) ||
              role.includes(
                searchValue
              )
            );

          }
        );


      renderUsers(
        filteredUsers
      );

    }


    function clearSearch() {

      document.getElementById(
        "userSearch"
      ).value = "";


      renderUsers(
        allUsers
      );

    }


    document
      .getElementById(
        "userSearch"
      )
      .addEventListener(
        "input",
        searchUsers
      );


    /* ================= ESCAPE HTML ================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ================= RENDER USERS ================= */

    function renderUsers(
      users
    ) {

      const tbody =
        document.getElementById(
          "usersTableBody"
        );


      if (!users.length) {

        tbody.innerHTML = `
          <tr>
            <td
              colspan="4"
              class="empty-message"
            >
              No users found.
            </td>
          </tr>
        `;

        return;

      }


      tbody.innerHTML =
        users
          .map(
            user => {

              const id =
                user._id ||
                user.id;


              const isAdmin =
                user.role === "admin";


              const hasPmp =
                user.courseAccess &&
                user.courseAccess.pmp === true;


              const roleBadge =
                isAdmin

                  ? `
                    <span class="badge badge-admin">
                      Admin
                    </span>
                  `

                  : `
                    <span class="badge badge-user">
                      User
                    </span>
                  `;


              const pmpBadge =
                hasPmp

                  ? `
                    <span class="badge badge-yes">
                      Granted
                    </span>
                  `

                  : `
                    <span class="badge badge-no">
                      Not Granted
                    </span>
                  `;


              let actionButtons =
                "";


              /*
                Admin accounts are protected.
              */

              if (isAdmin) {

                actionButtons = `
                  <span
                    style="
                      color:#6b7280;
                      font-size:13px;
                    "
                  >
                    Administrator
                  </span>
                `;

              } else {

                actionButtons = `
                  <div class="action-buttons">

                    ${
                      hasPmp

                        ? `
                          <button
                            class="revoke-btn"
                            onclick="updatePmpAccess(
                              '${escapeHtml(id)}',
                              false
                            )"
                          >
                            Revoke PMP
                          </button>
                        `

                        : `
                          <button
                            class="grant-btn"
                            onclick="updatePmpAccess(
                              '${escapeHtml(id)}',
                              true
                            )"
                          >
                            Grant PMP
                          </button>
                        `
                    }


                    <!--
                      Delete button is intentionally
                      smaller and separated from
                      the PMP access button.
                    -->

                    <button
                      class="delete-btn"
                      onclick="deleteUser(
                        '${escapeHtml(id)}'
                      )"
                    >
                      Delete User
                    </button>

                  </div>
                `;

              }


              return `
                <tr>

                  <td>
                    ${escapeHtml(
                      user.identifier
                    )}
                  </td>

                  <td>
                    ${roleBadge}
                  </td>

                  <td>
                    ${pmpBadge}
                  </td>

                  <td>
                    ${actionButtons}
                  </td>

                </tr>
              `;

            }
          )
          .join("");

    }


    /* ================= PMP ACCESS ================= */

    async function updatePmpAccess(
      userId,
      allowed
    ) {

      const token =
        getToken();


      if (!token) {

        window.location.href =
          "index.html";

        return;

      }


      const action =
        allowed
          ? "grant PMP access"
          : "revoke PMP access";


      const confirmed =
        confirm(
          `Are you sure you want to ${action} for this user?`
        );


      if (!confirmed) {

        return;

      }


      try {

        const response =
          await fetch(
            `${API_URL}/admin/users/${encodeURIComponent(userId)}/pmp`,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  `Bearer ${token}`
              },

              body:
                JSON.stringify({
                  allowed
                })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Could not update PMP access."
          );

        }


        showMessage(
          allowed
            ? "PMP access granted successfully."
            : "PMP access revoked successfully.",
          "success"
        );


        await loadUsers();


      } catch (error) {

        console.error(
          "PMP access update error:",
          error
        );


        showMessage(
          error.message ||
          "Could not update PMP access.",
          "error"
        );

      }

    }


    /* ================= DELETE USER ================= */

    async function deleteUser(
      userId
    ) {

      const token =
        getToken();


      if (!token) {

        window.location.href =
          "index.html";

        return;

      }


      const user =
        allUsers.find(
          item =>
            String(
              item._id ||
              item.id
            ) ===
            String(userId)
        );


      const identifier =
        user
          ? user.identifier
          : "this user";


      /*
        FIRST SAFETY CHECK
      */

      const confirmed =
        confirm(
          `WARNING!\n\nYou are about to permanently delete the account:\n\n${identifier}\n\nThis will remove the user account and their PMP progress.\n\nDo you want to continue?`
        );


      if (!confirmed) {

        return;

      }


      /*
        SECOND SAFETY CHECK

        Admin must manually type DELETE.
        This greatly reduces accidental deletion.
      */

      const confirmationText =
        prompt(
          `Final confirmation.\n\nType DELETE in capital letters to permanently delete:\n\n${identifier}`
        );


      if (
        confirmationText !==
        "DELETE"
      ) {

        showMessage(
          "User deletion cancelled. You must type DELETE exactly.",
          "error"
        );

        return;

      }


      try {

        const response =
          await fetch(
            `${API_URL}/admin/users/${encodeURIComponent(userId)}`,
            {
              method: "DELETE",

              headers: {
                "Authorization":
                  `Bearer ${token}`
              }
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Could not delete the user account."
          );

        }


        showMessage(
          "User account deleted successfully.",
          "success"
        );


        await loadUsers();


      } catch (error) {

        console.error(
          "Delete user error:",
          error
        );


        showMessage(
          error.message ||
          "Could not delete the user account.",
          "error"
        );

      }

    }


    /* ================= START ================= */

    loadUsers();

  </script>

</body>
</html>
